<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Metacheck on PsyArXiv</title>
<meta name="description" content="Metacheck's reproducibility checks of PsyArXiv preprints.">
<link rel="icon" type="image/png" href="images/logo.png">
<link rel="stylesheet" href="site.css">
<link rel="stylesheet" href="landing.css">
</head>
<body>

<header class="masthead">
  <img class="logo" src="images/logo.png" alt="Metacheck logo" width="76" height="88">
  <h1>Metacheck on PsyArXiv</h1>
  <p class="subtitle">Reproducibility checks of PsyArXiv preprints</p>
</header>

<main>
  <!-- Intro text: to be written by the project owner -->
  <p class="intro">[Intro text to come]</p>

  <div class="columns">
    <section class="tool">
      <h2>Preprints found</h2>
      <p class="tally-number" id="tally-preprints">&hellip;</p>
      <p class="note">Preprints listed on PsyArXiv so far.</p>
    </section>
    <section class="tool">
      <h2>Checked</h2>
      <p class="tally-number" id="tally-reports">&hellip;</p>
      <p class="note">Preprints with a metacheck report.</p>
    </section>
    <section class="tool">
      <h2>Updated</h2>
      <p class="tally-number" id="tally-updated">&hellip;</p>
      <p class="note">Date of the last update.</p>
    </section>
  </div>

  <!-- The list of reports, filled from data/index.json by landing.js.
       Heading and link wording: placeholders, to be written by the project owner. -->
  <section class="tool reports">
    <h2>Reports</h2>
    <ol class="report-list" id="report-list"></ol>
  </section>
</main>

<footer>
  <p>Metacheck is open source software by <a href="https://github.com/scienceverse" target="_blank" rel="noopener">scienceverse</a>.</p>
</footer>

<script src="landing.js"></script>
</body>
</html>
