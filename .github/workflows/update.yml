# Checks new PsyArXiv preprints (and older ones when none is waiting) with
# scripts/update.py, and commits the report pages and the data/ folder. A run
# starts no new preprint after 50 minutes; one paper's code may run for up to
# 60 minutes on the server, hence the 180-minute limit. Runs never overlap.
# It runs every hour, at 17 minutes past (GitHub may start it some minutes
# later), and can also be started by hand (Actions tab, "Run workflow"). To
# stop the hourly runs, put a # before the two schedule lines.
name: Update the reports

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      max:
        description: "Check at most this many preprints (0: no limit)"
        default: "0"

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Check preprints
        run: python3 scripts/update.py --minutes 50 --max "${{ inputs.max || '0' }}"

      - name: Save the results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A data
          git add -A -- '*_v*/index.html'
          if git diff --cached --quiet; then echo "No changes."; exit 0; fi
          git commit -m "Update the reports"
          git pull --rebase origin main
          git push origin HEAD:main

  publish:
    needs: update
    if: always()
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
